<!doctype html>
<html lang="pt-br">

<head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">

    <title>Cabeça Girando </title>
   
</head>

<body>
    <!-- Cabeçalho / Navbar -->
    <header class="navbar navbar-expand-lg navbar-dark bg-dark bg-gradient py-3 shadow-sm">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" href="#">
                <span class="fs-4">🌀</span>
                <span>My-Head</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav align-items-center gap-2">
                    <li class="nav-item">
                        <a class="nav-link active" href="#">Início</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="./readme.html">Sobre o Projeto</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#contato">Contato</a>
                    </li>
                </ul>
            </div>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="main-content">
        <div class="hero-card">
            <div class="avatar-wrapper">
                <div class="avatar-inner">
                    <a href="./readme.html" title="Clique para ver mais detalhes">
                        <img id="img" src="img/cabeca.jpg" alt="Cabeça Girando">
                    </a>
                </div>
            </div>
            
            <h1 class="hero-title"><span class="brand-text">My-Head</span> Project</h1>
            <p class="hero-subtitle">Animação interativa 360° construída com HTML5, Bootstrap 5, CSS3 e GSAP.</p>
            
            <div class="d-flex flex-wrap justify-content-center gap-2 mb-2">
                <button class="btn btn-outline-info control-btn" onclick="setSpeed(0.5)">0.5x</button>
                <button class="btn btn-info control-btn text-dark" onclick="setSpeed(1)">1x Normal</button>
                <button class="btn btn-outline-info control-btn" onclick="setSpeed(2.5)">2.5x Rápido</button>
                <button class="btn btn-outline-warning control-btn" onclick="toggleAnimation()">Pausar / Play</button>
            </div>
        </div>
    </main>

    <!-- Seção de Contato e Links -->

        <div class="container text-center">
            <h2 class="fs-5 text-muted mb-3">Conecte-se comigo</h2>
            <div class="d-flex justify-content-center gap-3 flex-wrap">
                <a href="https://github.com/Borges2423" target="_blank" rel="noopener noreferrer" class="btn btn-outline-light contact-link d-flex align-items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
                        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
                    </svg>
                    GitHub (Borges2423)
                </a>
                <a href="https://github.com/Borges2423/My-Head" target="_blank" rel="noopener noreferrer" class="btn btn-outline-info contact-link d-flex align-items-center gap-2">
                    <span>⭐</span> Repositório My-Head
                </a>
            </div>
        </div>
    </section>

    <!-- Rodapé -->
    <footer class="footer py-3 text-center border-top border-secondary border-opacity-25">
        <div class="container">
            <p class="text-muted small mb-0">© 2026 My-Head • Desenvolvido com GitFlow e publicado via GitHub Pages</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.10.4/gsap.min.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
